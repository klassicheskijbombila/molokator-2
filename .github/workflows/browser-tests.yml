name: Molokator browser checks
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser tests
        run: npx playwright test --config=playwright.config.cjs
      - name: Save report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molokator-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
